# Mac Mini production stack.
# Usage on the Mac Mini:
#   cd ~/projects/your-coach
#   cp .env.production.example .env && $EDITOR .env
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# The `app` service binds to 127.0.0.1:8000 on the Mac Mini — only the
# SSH reverse-tunnel to the VPS exposes it to the public.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainbeat
      POSTGRES_PASSWORD: trainbeat
      POSTGRES_DB: trainbeat
    volumes:
      - trainbeat-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://trainbeat:trainbeat@db:5432/trainbeat
      APP_ENV: prod
      BOT_MODE: polling
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  trainbeat-pg:
