[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainbeat"
version = "0.0.1"
description = "TrainBeat — Telegram bot + Mini-App backend"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4,<4",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-dateutil>=2.8",
  "apscheduler>=3.10",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trainbeat"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]
