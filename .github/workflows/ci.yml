name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainbeat
          POSTGRES_PASSWORD: trainbeat
          POSTGRES_DB: trainbeat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trainbeat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEGRAM_BOT_TOKEN: test-token-not-real
      DATABASE_URL: postgresql+asyncpg://trainbeat:trainbeat@localhost:5432/trainbeat
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check src tests
      - name: Test
        working-directory: backend
        run: pytest -q

  mini-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mini-app/package-lock.json
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Bundle-size budget
        run: npm run check-size

  docker:
    runs-on: ubuntu-latest
    needs: [backend, mini-app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trainbeat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size budget (≤ 400 MB)
        run: |
          size=$(docker image inspect trainbeat:ci --format='{{.Size}}')
          mb=$((size / 1024 / 1024))
          echo "Image size: ${mb} MB"
          if [ "$mb" -gt 400 ]; then
            echo "::error::Image exceeds 400 MB budget (${mb} MB)"
            exit 1
          fi
# Deploy is run manually on the Mac Mini home server — see deploy/README.md.
# No GitHub Action push-to-deploy: home network sits behind NAT, the
# tunnel-back path would add a credential to maintain for marginal benefit.
