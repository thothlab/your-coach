# Replace `app` with the value chosen during `fly launch`.
app = "trainbeat"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = 10

[build]

[env]
  APP_ENV = "prod"
  PORT = "8000"

[experimental]
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 100
    soft_limit = 80
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    grace_period = "15s"
    interval = "30s"
    method = "get"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"

[deploy]
  release_command = ""

# Keep one machine running so the apscheduler worker can fire reminders
# even when there is no incoming HTTP traffic.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "python -m trainbeat serve"

[metrics]
  port = 9091
  path = "/metrics"
